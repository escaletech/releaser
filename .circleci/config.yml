version: 2.1

orbs:
  gh-release: escaletech/gh-conventional-release@0.1

jobs:
  test:
    docker:
      - image: circleci/node:12
    steps:
      # The project deploy key is rejected by GitHub. The repo is public,
      # so fetch this commit over HTTPS instead of the built-in SSH checkout.
      - run:
          name: Checkout code
          command: |
            git init
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            git fetch --depth 1 origin "${CIRCLE_SHA}"
            git checkout --force FETCH_HEAD
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage

workflows:
  version: 2
  ci:
    jobs:
      - test:
          filters: { branches: { ignore: master }, tags: { ignore: /.*/ } }

  release:
    jobs:
      - gh-release/create-release:
          filters: { branches: { ignore: /.*/ }, tags: { only: /v.+/ } }
          context: github-create-release
